services:
  postgres:
    image: postgres:16-alpine
    container_name: mbooks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mbooks
    volumes:
      - mbooks_pg_data:/var/lib/postgresql/data

  # No host port published - runs on the same box as EducationMarket's own
  # nginx now (see nginx/mbooks.conf there), reached by container name over
  # the shared educationmarket_bazar_network instead of a Germany<->Arvan
  # SSH tunnel (that tunnel - mbooks-tunnel.service - is what made the
  # studio feel slow; moving the app itself onto Arvan removes that hop
  # entirely rather than just caching around it).
  api:
    build:
      context: ./api
    container_name: mbooks_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://mbooks:${POSTGRES_PASSWORD}@postgres:5432/mbooks
      PORT: 3300
      NODE_ENV: production
      MBOOKS_DATA_DIR: /data
      MBOOKS_STUDIO_DIR: /studio
    volumes:
      - mbooks_data:/data
      - ./studio:/studio:ro
    networks:
      - default
      - bazar_network

networks:
  bazar_network:
    name: educationmarket_bazar_network
    external: true

volumes:
  mbooks_pg_data:
  mbooks_data:
