services:
  postgres:
    image: postgres:16-alpine
    container_name: mbooks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mbooks
    volumes:
      - mbooks_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  api:
    build:
      context: ./api
    container_name: mbooks_api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://mbooks:${POSTGRES_PASSWORD}@postgres:5432/mbooks
      PORT: 3300
      NODE_ENV: production
      MBOOKS_DATA_DIR: /data
      MBOOKS_STUDIO_DIR: /studio
    volumes:
      - mbooks_data:/data
      - ./studio:/studio:ro
    ports:
      - "127.0.0.1:${API_PORT:-3300}:3300"

volumes:
  mbooks_pg_data:
  mbooks_data:
