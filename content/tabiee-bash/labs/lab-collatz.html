<div class="lab" id="lab-collatz">
<div class="lab-head"><span class="lab-kicker">آزمایشگاه تعاملی</span><h3>مسیر کولاتز</h3></div>
<style>
#lab-collatz .row{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin:.4rem 0}
#lab-collatz input[type=number]{font:inherit;width:9em;padding:.2rem .4rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper,#fff);color:var(--ink)}
#lab-collatz button{font:inherit;padding:.25rem .8rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper,#fff);color:var(--ink);cursor:pointer}
#lab-collatz button:hover{border-color:var(--clay)}
#lab-collatz svg{width:100%;max-width:640px;height:auto;display:block;margin:.6rem auto}
#lab-collatz .stats{font-variant-numeric:tabular-nums;font-weight:600}
#lab-collatz .path{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;line-height:1.6;max-height:9em;overflow:auto;border-top:1px solid var(--rule);padding-top:.4rem;word-break:break-word}
#lab-collatz .msg{min-height:1.4em;color:var(--clay);font-weight:600}
</style>
<div class="row">
  <label>عدد شروع: <input type="number" min="1" max="1000000" value="27" data-k="n"></label>
  <button data-k="go">رسم مسیر</button>
  <span>امتحان کنید:</span>
  <button data-v="6">۶</button><button data-v="7">۷</button><button data-v="27">۲۷</button><button data-v="97">۹۷</button><button data-v="871">۸۷۱</button>
</div>
<div class="stats" data-k="stats" aria-live="polite"></div>
<div class="msg" data-k="msg"></div>
<svg viewBox="0 0 640 260" data-k="svg" role="img" aria-label="نمودار مقدار عدد بر حسب شماره‌ی گام، با محور عمودی لگاریتمی"></svg>
<div class="path" data-k="path"></div>
<script>
(function(){
  var root=document.getElementById('lab-collatz'); if(!root) return;
  var $=function(k){return root.querySelector('[data-k="'+k+'"]');};
  var fa=function(x){return String(x).replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});};
  function orbit(n){ var a=[n]; while(n!==1){ n=(n%2===0)? n/2 : 3*n+1; a.push(n); } return a; }
  function run(){
    var n=Math.floor(+$('n').value); $('msg').textContent='';
    if(!(n>=1 && n<=1000000)){ $('msg').textContent='عددی طبیعی بین ۱ و ۱٬۰۰۰٬۰۰۰ وارد کنید.'; return; }
    var a=orbit(n), steps=a.length-1, mx=Math.max.apply(null,a), at=a.indexOf(mx);
    $('stats').textContent='تعداد گام‌ها تا ۱: '+fa(steps)+'   ·   بزرگ‌ترین عدد مسیر: '+fa(mx)+' (در گام '+fa(at)+')';
    $('path').textContent = steps<200 ? a.join(' → ') : 'مسیر '+steps+' گام دارد؛ فقط نمودار نشان داده می‌شود.';
    var W=640,H=260,L=46,R=12,T=12,B=30, lm=Math.log10(Math.max(mx,10)), s='';
    var X=function(i){return L+(W-L-R)*(steps? i/steps : 0);}, Y=function(v){return T+(H-T-B)*(1-Math.log10(v)/lm);};
    for(var e=0;e<=Math.ceil(lm);e++){ var v=Math.pow(10,e); if(v>Math.pow(10,lm)*1.0001) break; var y=Y(v);
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--rule)" stroke-width="1"/>';
      s+='<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="currentColor" direction="ltr" unicode-bidi="embed">10<tspan dy="-4" font-size="8">'+e+'</tspan></text>'; }
    s+='<text x="'+((L+W-R)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="currentColor">شماره‌ی گام (۰ تا '+fa(steps)+')</text>';
    var d=''; a.forEach(function(v,i){ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); });
    s+='<path d="'+d+'" fill="none" stroke="var(--clay)" stroke-width="1.6" stroke-linejoin="round"/>';
    s+='<circle cx="'+X(at)+'" cy="'+Y(mx)+'" r="4" fill="var(--ink)"/>';
    $('svg').innerHTML=s;
  }
  $('go').onclick=run;
  $('n').addEventListener('keydown',function(ev){ if(ev.key==='Enter') run(); });
  root.querySelectorAll('[data-v]').forEach(function(b){ b.onclick=function(){ $('n').value=b.getAttribute('data-v'); run(); }; });
  run();
})();
</script>
</div>
