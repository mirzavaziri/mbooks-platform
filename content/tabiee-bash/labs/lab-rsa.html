<div class="lab" id="lab-rsa">
<div class="lab-head"><span class="lab-kicker">آزمایشگاه تعاملی</span><h3>آزمایشگاه RSA</h3></div>
<style>
#lab-rsa .row{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin:.4rem 0}
#lab-rsa input{font:inherit;padding:.2rem .4rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper,#fff);color:var(--ink)}
#lab-rsa input[type=number]{width:6.5em}
#lab-rsa input[type=text]{width:16em}
#lab-rsa button{font:inherit;padding:.25rem .8rem;border:1px solid var(--rule);border-radius:4px;background:var(--paper,#fff);color:var(--ink);cursor:pointer}
#lab-rsa button:hover{border-color:var(--clay)}
#lab-rsa .cols{display:flex;flex-wrap:wrap;gap:1rem;margin-top:.6rem}
#lab-rsa .cols>.box{flex:1 1 240px}
#lab-rsa .box{border:1px solid var(--rule);border-radius:6px;padding:.5rem .7rem}
#lab-rsa .box h4{margin:.1rem 0 .4rem;font-size:1rem}
#lab-rsa .num{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:.85rem;word-break:break-all}
#lab-rsa .pub{background:color-mix(in srgb,var(--clay) 10%,transparent);border-radius:4px;padding:.3rem .5rem;margin:.4rem 0}
#lab-rsa .msg{min-height:1.4em;color:var(--clay);font-weight:600}
#lab-rsa table{border-collapse:collapse;font-size:.85rem;width:100%}
#lab-rsa td,#lab-rsa th{border-bottom:1px solid var(--rule);padding:.15rem .3rem;text-align:center;font-variant-numeric:tabular-nums}
</style>
<div class="row">
  <label>p: <input type="number" data-k="p" value="61"></label>
  <label>q: <input type="number" data-k="q" value="53"></label>
  <label>e: <input type="number" data-k="e" value="17"></label>
  <button data-k="rand">انتخاب تصادفی p و q</button>
</div>
<div class="row">
  <label>پیام: <input type="text" data-k="m" value="Hello 1404"></label>
  <button data-k="go">رمز کن و بفرست</button>
</div>
<div class="msg" data-k="msg" aria-live="polite"></div>
<div class="cols">
  <div class="box"><h4>فرستنده</h4>
    <div>کلید عمومی که همه می‌بینند:</div><div class="pub num" data-k="pub"></div>
    <div data-k="enc"></div>
  </div>
  <div class="box"><h4>گیرنده</h4>
    <div>کلید خصوصی که فقط گیرنده دارد:</div><div class="pub num" data-k="priv"></div>
    <div data-k="dec"></div>
  </div>
</div>
<div class="box" style="margin-top:1rem"><h4>مهاجم</h4>
  <div>فقط کلید عمومی و رمزها را می‌بیند. برای یافتن d باید n را تجزیه کند.</div>
  <div class="row"><button data-k="attack">تجزیه کن (تقسیم‌های پیاپی)</button><span data-k="att"></span></div>
</div>
<script>
(function(){
  var root=document.getElementById('lab-rsa'); if(!root) return;
  var $=function(k){return root.querySelector('[data-k="'+k+'"]');};
  var fa=function(x){return String(x).replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});};
  function isPrime(n){ if(n<2||n!==Math.floor(n)) return false; for(var d=2;d*d<=n;d++) if(n%d===0) return false; return true; }
  function gcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
  function inv(a,m){ var r0=m,r1=a%m,s0=0,s1=1; while(r1){ var q=Math.floor(r0/r1),t=r0-q*r1; r0=r1; r1=t; t=s0-q*s1; s0=s1; s1=t; } return r0===1 ? ((s0%m)+m)%m : null; }
  function pw(b,k,m){ var B=BigInt(b),K=BigInt(k),M=BigInt(m),r=1n; B%=M; while(K>0n){ if(K&1n) r=r*B%M; B=B*B%M; K>>=1n; } return Number(r); }
  var key=null;
  function makeKey(){
    var p=+$('p').value,q=+$('q').value,e=+$('e').value; $('msg').textContent=''; key=null;
    if(!isPrime(p)||!isPrime(q)){ $('msg').textContent='p و q باید عدد اول باشند.'; return false; }
    if(p===q){ $('msg').textContent='p و q باید متفاوت باشند.'; return false; }
    var n=p*q, phi=(p-1)*(q-1);
    if(!(e>1 && e<phi) || gcd(e,phi)!==1){ $('msg').textContent='e باید بین ۱ و φ(n)='+fa(phi)+' و نسبت به آن اول باشد؛ وگرنه d وجود ندارد.'; return false; }
    key={p:p,q:q,n:n,phi:phi,e:e,d:inv(e,phi)};
    $('pub').textContent='(n, e) = ('+n+', '+e+')';
    $('priv').innerHTML='<b>d = '+key.d+'</b><br>p = '+p+', q = '+q+', φ(n) = '+phi;
    return true;
  }
  function go(){
    if(!makeKey()) { $('enc').innerHTML=''; $('dec').innerHTML=''; return; }
    var text=$('m').value, codes=Array.from(text).map(function(c){return c.codePointAt(0);});
    var big=codes.filter(function(c){return c>=key.n;});
    if(big.length){ $('msg').textContent='کد حرف «'+String.fromCodePoint(big[0])+'» برابر '+fa(big[0])+' است و باید از n کمتر باشد؛ p و q بزرگ‌تری انتخاب کنید.'; return; }
    var cs=codes.map(function(m){return pw(m,key.e,key.n);});
    var t='<table><tr><th>حرف</th><th>m</th><th>c = m^e mod n</th></tr>';
    codes.forEach(function(m,i){ t+='<tr><td>'+(String.fromCodePoint(m)===' '?'␣':String.fromCodePoint(m))+'</td><td>'+m+'</td><td>'+cs[i]+'</td></tr>'; });
    $('enc').innerHTML=t+'</table>';
    var back=cs.map(function(c){return pw(c,key.d,key.n);});
    $('dec').innerHTML='<div>رمزگشایی با <bdi dir="ltr">m = c^d mod n</bdi>:</div><div class="num">'+back.join(' ')+'</div><div>پیام بازیافته: <b>'+back.map(function(x){return String.fromCodePoint(x);}).join('').replace(/</g,'&lt;')+'</b></div>';
    $('att').textContent='';
  }
  $('rand').onclick=function(){
    var ps=[]; for(var k=300;k<1000;k++) if(isPrime(k)) ps.push(k);
    var p=ps[Math.floor(Math.random()*ps.length)], q; do{ q=ps[Math.floor(Math.random()*ps.length)]; }while(q===p);
    $('p').value=p; $('q').value=q; var phi=(p-1)*(q-1), e=65537; if(e>=phi||gcd(e,phi)!==1){ e=3; while(gcd(e,phi)!==1) e+=2; } $('e').value=e; go(); };
  $('go').onclick=go;
  $('attack').onclick=function(){ if(!key){ go(); if(!key) return; }
    var n=key.n, t0=performance.now(), d=2, tries=0; while(n%d!==0){ d++; tries++; }
    var ms=performance.now()-t0, f=n/d, phi=(d-1)*(f-1), dd=inv(key.e,phi);
    $('att').innerHTML='<bdi dir="ltr">n = '+d+' × '+f+'</bdi> با '+fa(tries+1)+' تقسیم، در '+(ms<1?'کمتر از یک':fa(ms.toFixed(1)))+' میلی‌ثانیه؛ پس <bdi dir="ltr">d = '+dd+'</bdi>. برای n ششصدرقمی همین روش بیش از عمر جهان طول می‌کشد.'; };
  go();
})();
</script>
</div>
